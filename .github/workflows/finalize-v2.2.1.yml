name: Finalize dwrean DeskPins 2.2.1

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/finalize-v2.2.1.yml

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.repository == 'dwrean-net/dwrean-deskpins' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check final release
        id: release_check
        shell: pwsh
        run: |
          gh release view v2.2.1 *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Remove Beta branding and clean one-off workflows
        id: finalize_source
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $files = @(
            "src/modern/main.cpp",
            "src/modern/dwrean-deskpins.rc"
          )

          foreach ($file in $files) {
            $content = Get-Content $file -Raw -Encoding UTF8
            $content = $content.Replace("2.2.1 Beta", "2.2.1")
            [System.IO.File]::WriteAllText((Resolve-Path $file), $content, (New-Object System.Text.UTF8Encoding($false)))
          }

          Remove-Item ".github/workflows/publish-v2.2.1-beta.yml" -ErrorAction SilentlyContinue
          Remove-Item ".github/workflows/finalize-v2.2.1.yml" -ErrorAction SilentlyContinue

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Finalize dwrean DeskPins 2.2.1"
            git push origin HEAD:master
          }

          "final_sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Remove old Beta prerelease
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          gh release view v2.2.1-beta *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete v2.2.1-beta -y --cleanup-tag
          }
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Configure x64
        if: steps.release_check.outputs.exists != 'true'
        run: cmake -S . -B build-x64 -A x64

      - name: Build x64
        if: steps.release_check.outputs.exists != 'true'
        run: cmake --build build-x64 --config Release --parallel

      - name: Configure Win32
        if: steps.release_check.outputs.exists != 'true'
        run: cmake -S . -B build-Win32 -A Win32

      - name: Build Win32
        if: steps.release_check.outputs.exists != 'true'
        run: cmake --build build-Win32 --config Release --parallel

      - name: Package
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-x64 | Out-Null
          New-Item -ItemType Directory -Force release-Win32 | Out-Null
          Copy-Item build-x64/Release/dwrean-deskpins.exe release-x64/
          Copy-Item build-Win32/Release/dwrean-deskpins.exe release-Win32/
          Copy-Item readme.md release-x64/
          Copy-Item readme.md release-Win32/
          Copy-Item license.txt release-x64/
          Copy-Item license.txt release-Win32/
          Compress-Archive -Path release-x64/* -DestinationPath dwrean-deskpins-2.2.1-x64.zip
          Compress-Archive -Path release-Win32/* -DestinationPath dwrean-deskpins-2.2.1-Win32.zip

      - name: Create stable GitHub release
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          @"
          ## dwrean DeskPins 2.2.1

          Σύγχρονο fork του DeskPins για Windows 10/11, με ελληνικό περιβάλλον.

          ### Τι περιλαμβάνει
          - Καρφίτσωμα οποιουδήποτε παραθύρου ώστε να παραμένει πάντα μπροστά.
          - Ορατή, ρεαλιστική πινέζα πάνω στο καρφιτσωμένο παράθυρο.
          - Κλικ πάνω στην πινέζα για άμεσο ξεκαρφίτσωμα.
          - Πλήρες ελληνικό interface.
          - Ctrl+Alt+P για γρήγορο pin/unpin του ενεργού παραθύρου.
          - Προαιρετική εκκίνηση μαζί με τα Windows.
          - Ενεργό link προς το dwrean.net στο παράθυρο «Σχετικά».
          - Portable, χωρίς εξωτερικές εξαρτήσεις.

          Αρχικό DeskPins: Elias Fotinis. Εκσυγχρονισμός: dwrean.net.
          "@ | Set-Content -Encoding UTF8 release-notes.md

          gh release create v2.2.1 `
            dwrean-deskpins-2.2.1-x64.zip `
            dwrean-deskpins-2.2.1-Win32.zip `
            --target "${{ steps.finalize_source.outputs.final_sha }}" `
            --title "dwrean DeskPins 2.2.1" `
            --notes-file release-notes.md `
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
